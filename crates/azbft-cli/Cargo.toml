[package]
name = "azbft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "azbft"
path = "src/main.rs"

[dependencies]
azbft-devnet = { path = "../azbft-devnet" }
azbft-types = { path = "../azbft-types" }
azbft-verifier = { path = "../azbft-verifier" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
